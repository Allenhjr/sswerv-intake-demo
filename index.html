<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSwerv Intake Demo</title><style>body{font:16px system-ui;background:#10121d;color:#f5e7c9;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{color:#d4af37}section{background:#202337;border-radius:14px;padding:18px;margin:18px 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #777;font:inherit}button{background:#d4af37;color:#10121d;font-weight:bold;cursor:pointer}article{border-top:1px solid #555;padding:12px 0}small{color:#c9c7d2}label{display:block} .secondary{background:#3a2564;color:white}</style></head><body><main><h1>SSwerv Intake</h1><p>Local-only prototype • fictional customer information only</p><section><h2>New inquiry</h2><form id="leadForm"><label>Name<input name="name" required maxlength="80" placeholder="Example Customer"></label><label>Email<input name="email" type="email" required placeholder="example@example.com"></label><label>Service<select name="service"><option>Consultation</option><option>Repair</option><option>Installation</option><option>Other</option></select></label><label>Message<textarea name="message" required maxlength="500" placeholder="Describe the request"></textarea></label><button>Add inquiry</button></form></section><section><h2>Lead dashboard</h2><p id="count"></p><div id="leads"></div><button class="secondary" id="reset">Clear demo leads</button></section></main><script>const key='sswerv-intake-demo-v1';let leads=[];try{leads=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(leads))leads=[]}catch{leads=[]}const save=()=>{localStorage.setItem(key,JSON.stringify(leads));render()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.querySelector('#count').textContent=leads.length+' inquiries';document.querySelector('#leads').innerHTML=leads.map(l=>'<article><strong>'+esc(l.name)+'</strong> • '+esc(l.service)+'<p>'+esc(l.message)+'</p><small>'+esc(l.email)+' • '+esc(l.date)+'</small><label>Status<select data-id="'+l.id+'">'+['New','Contacted','Quoted','Closed'].map(s=>'<option '+(l.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><button class="secondary" data-copy="'+l.id+'">Copy suggested reply</button></article>').join('')||'<p>No inquiries yet.</p>'}document.querySelector('#leadForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);leads.unshift({id:String(Date.now()),name:d.get('name').trim(),email:d.get('email').trim(),service:d.get('service'),message:d.get('message').trim(),status:'New',date:new Date().toLocaleString()});save();e.target.reset()});document.querySelector('#leads').addEventListener('change',e=>{if(!e.target.dataset.id)return;const l=leads.find(x=>x.id===e.target.dataset.id);if(l){l.status=e.target.value;save()}});document.querySelector('#leads').addEventListener('click',async e=>{const id=e.target.dataset.copy;if(!id)return;const l=leads.find(x=>x.id===id);if(!l)return;const msg='Hi '+l.name+', thanks for contacting us about '+l.service.toLowerCase()+'. We received your inquiry and will follow up soon.';try{await navigator.clipboard.writeText(msg);e.target.textContent='Copied for review'}catch{window.prompt('Copy suggested reply:',msg)}});document.querySelector('#reset').onclick=()=>{if(confirm('Clear all demo leads?')){leads=[];save()}};render();</script></body></html>
